version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 99
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 10
    groups:
      npm-dependencies:
        patterns: ['*']
  - package-ecosystem: cargo
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 5
