name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, Format, Lint & Type Check
    if: github.event_name != 'pull_request' || github.head_ref != 'staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - run: bun install --frozen-lockfile
      - name: Format check
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Type check
        run: bun run type:check
      - name: Build
        run: bun run build
      - name: Build Sepolia
        run: bun run build:sepolia

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - run: bun install --frozen-lockfile
      - name: Test
        run: bun run test

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.head_ref != 'staging'
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - run: bun install --frozen-lockfile
      - name: Run bun audit
        run: bun audit --frozen-lockfile
