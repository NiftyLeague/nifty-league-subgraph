name: Algolia Search

on:
  # Manual trigger only — no automatic indexing for the subgraph repo
  workflow_dispatch:

jobs:
  search:
    name: Run Algolia Search Scraper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Run Scraper
        env:
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_API_KEY: ${{ secrets.ALGOLIA_API_KEY }}
        run: |
          echo "Algolia scraper is configured for workflow_dispatch only."
          echo "To index search, provide ALGOLIA_APP_ID and ALGOLIA_API_KEY secrets."
